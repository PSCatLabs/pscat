[package]
name = "pscat"
version = "0.7.0-rc.4"
edition = "2024"
description = "PostScript for precision and imagination: a PostScript and EPS interpreter that renders documents and art to PNG, SVG and PDF"
# The code is MIT OR Apache-2.0. The OFL-1.1 term covers only the font data
# compiled in: the Liberation faces (src/font.rs), the URW Symbol/ZapfDingbats
# faces and lib/typewriter_outlines.ps (derived from Courier Prime). LPPL-1.3c
# (the GUST Font License) covers the embedded TeX Gyre faces (issue #757).
# See THIRD_PARTY_NOTICES.md (issue #563).
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND LPPL-1.3c"
authors = ["Jerome Banks"]
repository = "https://github.com/PSCatLabs/pscat"
homepage = "https://pscatlabs.github.io/pscat/"
documentation = "https://docs.rs/pscat"
readme = "README.md"
keywords = ["postscript", "interpreter", "graphics", "rendering", "vector"]
categories = ["rendering", "graphics", "command-line-utilities", "wasm"]
# Let chains (`if let ... && let ...`) need 1.88; checked with
# `cargo +1.88 check --all-targets --locked`.
rust-version = "1.88"
# An allowlist, so the published crate carries only what the licence
# expression above and THIRD_PARTY_NOTICES.md cover. build.rs reads lib/*.ps;
# src/font.rs embeds the Liberation faces. The font catalog, gallery,
# examples, site, docs and test data stay out (they have other terms).
# Anything newly embedded with include_bytes!/include_str! must be added here.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**",
    "/lib/**/*.ps",
    "/fonts/Liberation*.ttf",
    "/fonts/base35/*/*.otf",
    "/fonts/base35/*/GUST-FONT-LICENSE.txt",
    "/fonts/base35/URW-symbols/LICENSE.md",
    "/fonts/base35/URW-symbols/LICENSE.OFL",
    "/fonts/base35/URW-symbols/PROVENANCE.md",
    "/fonts/LICENSE",
    "/fonts/README.md",
    "/fonts/packs.json",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/LICENSE-OFL",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses/assets.json",
]

# No `[lib] crate-type`: the library is an ordinary rlib. Listing `cdylib`
# here made every downstream crate that depends on pscat also link a
# libpscat.dylib/.so/.dll it never uses (issue #565).
# scripts/build_wasm.sh asks for the cdylib only for the wasm32 build, with
# `cargo rustc --crate-type cdylib`.

[features]
# `window` is the live window (`pscat file.ps`, `--interactive`, `--spool`).
# It is on by default, so `cargo install pscat` gets the full CLI. A library
# user who only renders to PNG/SVG/PDF writes
# `pscat = { version = "...", default-features = false }` and gets no winit or
# softbuffer in their dependency graph; scripts/check_package.sh asserts that
# with `cargo tree`. Without it, the windowed CLI modes print an error and
# exit, and every headless mode works as before.
default = ["window"]
window = ["dep:winit", "dep:softbuffer"]
# `gpu` adds `--gpu-preview` (issue #742): compiled kernels (`kernelimage`)
# lowered to WGSL and run through wgpu, in f32, as a fast approximate
# preview. Off by default: it is a large dependency tree, and final renders
# stay on the exact CPU path. Not available on wasm32.
gpu = ["dep:wgpu", "dep:pollster"]

[package.metadata.docs.rs]
# The documented API is the headless library; the window is a CLI concern
# (its module is #[doc(hidden)]), so docs.rs skips building winit. One target
# is enough: nothing in the public API is platform specific.
# Check locally with:
#   RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo doc --no-deps --no-default-features
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "pscat-mcp"
path = "src/bin/pscat_mcp.rs"

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "vs_gs"
harness = false

[[bench]]
name = "regression"
harness = false

# CI runs `cargo test --profile ci` (issue #204): optimized like release
# (the suite is dominated by PostScript run through the interpreter, ~14x
# slower unoptimized), but with the checks a debug build gives, so a
# panic-on-overflow or a failed debug_assert still fails the test job.
# Output lands in target/ci/, same depth as target/release/ and
# target/debug/, so src/paths.rs's "three levels up" checkout lookup
# holds; that lookup exists only with debug-assertions on (#598), which
# is one more reason this profile keeps them.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

[dependencies]
serde_json = "1"
thiserror = "2"
flate2 = "1"
# `search` (issue #1176): a linear substring search (two-way with SIMD
# prefilters) instead of an O(n*m) scan. Already in every build through
# serde_json, so this adds no crate.
memchr = "2"
tiny-skia = "0.12.0"
ttf-parser = "0.25"
zune-jpeg = "0.5.15"
# Pure-Rust libm: every transcendental in src/ goes through src/fmath.rs, so
# seeded renders match across macOS, Linux and wasm (issue #738). Pinned
# exactly: a new libm release can change the last bit of a result.
libm = { version = "=0.2.16", default-features = false }

# The live window is desktop-only; the wasm32 build (Stage 16) ships
# the interpreter core and paints into a <canvas> instead.
# Optional: only the `window` feature (on by default) pulls them in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }
# `pscat fonts` (issue #599): unpack and verify the .tar.zst font packs.
# Pure Rust, no C toolchain; ruzstd's frame checksum (the `hash`
# feature) is off because every file is checked against its SHA-256.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12", "parking_lot"] }
pollster = { version = "1.0.1", optional = true }
sha2 = "0.11.1"

# `O_NONBLOCK`, for src/paths.rs: a resource candidate is opened without
# blocking so a FIFO with no writer cannot hang the resolver (issue #1177).
# Already in the tree through winit and the std runtime; no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# tests/qr.rs decodes PSCat's own rendered QR symbols with an independent
# pure-Rust reader (issue #971). Compiled into the test binary, so the decode
# check can never skip for want of a decoder. No `img` feature: the test feeds
# it greyscale pixels from tiny-skia's PNG loader, so no image crate comes in.
#
# tests/qr.rs also rasterizes PSCat's SVG and PDF exports with independent
# pure-Rust renderers before decoding them (issue #972): resvg for SVG and
# hayro for PDF. Compiled in for the same reason, so those checks cannot skip.
# hayro is held at 0.4.0: 0.5 and later make flate2 use its zlib-rs backend,
# and a dev-dependency's features reach the pscat binary the tests run, so
# pscat's own PNG/PDF compression would change under test (tests/mcp.rs
# caught it); 0.7 and later also need rustc 1.92, above our rust-version.
# No default features: the QR exports have no text or images.
#
# tests/qr_corpus.rs (issue #973) reads every rendered symbol with a second,
# unrelated decoder too: rxing, a pure-Rust port of ZXing (rqrr is a quirc
# port). Only its QR reader: `qrcode` + `decoders`, and `encoding_rs`,
# without which its QR decoder panics (`no_character_set_support` is
# unimplemented). No image crate. Its features reaching pscat's own
# dependencies are inert (num-traits `i128`, simdutf8 `public_imp`/NEON);
# pscat binaries built with and without it rendered the artkit/paintkit
# corpus byte-identically (identity_check.sh, 120 pages).
[dev-dependencies]
hayro = { version = "=0.4.0", default-features = false }
resvg = { version = "=0.49.0", default-features = false }
rqrr = { version = "=0.11.0", default-features = false }
rxing = { version = "=0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

# tests/common's CPU-time clock (issue #329); already in the tree through
# winit and friends in a default build. A dev-dependency, so a library user
# never sees it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
