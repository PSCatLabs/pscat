[package]
name = "pscat"
version = "0.5.1"
edition = "2024"
description = "A PostScript interpreter for watching programs draw, live"
# The code is MIT OR Apache-2.0. The OFL-1.1 term covers only the font data
# compiled in: the Liberation faces (src/font.rs) and lib/typewriter_outlines.ps
# (derived from Courier Prime). See THIRD_PARTY_NOTICES.md (issue #563).
license = "(MIT OR Apache-2.0) AND OFL-1.1"
authors = ["Jerome Banks"]
repository = "https://github.com/jeromebanks/postscript_interpreter"
homepage = "https://jeromebanks.github.io/postscript_interpreter/"
documentation = "https://docs.rs/pscat"
readme = "README.md"
keywords = ["postscript", "interpreter", "graphics", "rendering", "vector"]
categories = ["rendering", "graphics", "command-line-utilities", "wasm"]
# Let chains (`if let ... && let ...`) need 1.88; checked with
# `cargo +1.88 check --all-targets --locked`.
rust-version = "1.88"
# An allowlist, so the published crate carries only what the licence
# expression above and THIRD_PARTY_NOTICES.md cover. build.rs reads lib/*.ps;
# src/font.rs embeds the Liberation faces. The font catalog, gallery,
# examples, site, docs and test data stay out (they have other terms).
# Anything newly embedded with include_bytes!/include_str! must be added here.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**",
    "/lib/**/*.ps",
    "/fonts/Liberation*.ttf",
    "/fonts/LICENSE",
    "/fonts/README.md",
    "/fonts/packs.json",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/LICENSE-OFL",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses/assets.json",
]

[lib]
# cdylib is the wasm32 build (scripts/build_wasm.sh); rlib is everything else.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pscat-mcp"
path = "src/bin/pscat_mcp.rs"

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "vs_gs"
harness = false

[[bench]]
name = "regression"
harness = false

# CI runs `cargo test --profile ci` (issue #204): optimized like release
# (the suite is dominated by PostScript run through the interpreter, ~14x
# slower unoptimized), but with the checks a debug build gives, so a
# panic-on-overflow or a failed debug_assert still fails the test job.
# Output lands in target/ci/, same depth as target/release/ and
# target/debug/, so src/paths.rs's "three levels up" checkout lookup
# holds; that lookup exists only with debug-assertions on (#598), which
# is one more reason this profile keeps them.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

[dependencies]
serde_json = "1"
thiserror = "2"
flate2 = "1"
tiny-skia = "0.12.0"
ttf-parser = "0.25"
zune-jpeg = "0.5.15"

# The live window is desktop-only; the wasm32 build (Stage 16) ships
# the interpreter core and paints into a <canvas> instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"
# `pscat fonts` (issue #599): unpack and verify the .tar.zst font packs.
# Pure Rust, no C toolchain; ruzstd's frame checksum (the `hash`
# feature) is off because every file is checked against its SHA-256.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
sha2 = "0.11.1"

# tests/common's CPU-time clock (issue #329); already in the tree through
# winit and friends, so this adds nothing new to the build.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
