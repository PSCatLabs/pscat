<!DOCTYPE html>
<html lang="en">
<head>
<!--@head-->
<title>pscat playground — PostScript in the browser</title>
</head>
<body class="app">
<!--@header playground-->
<div id="play">
  <div id="play-left">
    <textarea id="src" spellcheck="false">%!PS
% A golden spiral of squares - edit me and press Run.
/rects 90 def
306 396 translate
0.9 0.9 scale
0 1 rects 1 sub {
    /i exch def
    gsave
    i 11 mul rotate
    i 4.2 mul dup translate
    i rects div dup dup 0.25 add 0.9 sethsbcolor
    -140 -140 280 280 rectstroke
    grestore
} for
showpage</textarea>
    <div id="controls">
      <button id="run">Run</button>
      <select id="examples">
        <option value="">— load an example —</option>
        <option value="sierpinski.ps">Sierpinski triangle</option>
        <option value="koch_snowflake.ps">Koch snowflake</option>
        <option value="golden_spiral.ps">Golden spiral</option>
        <option value="specimen.ps">Type specimen</option>
        <option value="testcard.ps">Test card</option>
        <option value="handwriting.ps">Handwriting-style letter (/HandScript)</option>
        <option value="hundred_lines.ps">Hundred Lines (chalkboard)</option>
        <option value="fern.ps">Fern, after Barnsley (48k points)</option>
        <option value="golden_bloom.ps">Golden Bloom (phyllotaxis)</option>
        <option value="cathedral_rose.ps">Cathedral Rose (Maurer rose)</option>
      </select>
      <label>speed <input id="speed" type="range" min="1" max="4000" value="220"></label>
      <span id="status"></span>
    </div>
    <div id="err"></div>
    <div id="warn"></div>
    <pre id="out" aria-label="Program output" hidden></pre>
  </div>
  <div id="play-right"><canvas id="page" width="612" height="792"></canvas></div>
</div>

<script type="module">
import { Pscat } from './pscat.js';

const canvas = document.getElementById('page');
const err = document.getElementById('err');
const warn = document.getElementById('warn');
const status = document.getElementById('status');
const speed = document.getElementById('speed');
const out = document.getElementById('out');
const srcBox = document.getElementById('src');
const ps = await Pscat.load();
let raf = 0;

// The browser build has no clock, so a step cap is the only thing that can
// stop one operator that runs away inside a frame (a decompression bomb:
// decoded filter output counts a step per KiB, and one flushfile or image
// drains it all before the page gets control back). The cap is per frame,
// set again before every step() call, because the page only runs `speed`
// steps a frame: a cap on the whole program would sit at billions of steps,
// hours of frames away, and a bomb drains about 90,000 KiB (steps) a second.
// 500,000 is about a hundred times the most a frame of any gallery piece or
// example charges (5,306 at the slider's top speed), and stops a bomb after
// about 500 MiB, some six seconds (#1210, notes/1210-playground-step-limit.md).
// ?maxsteps=N changes it for one visit; 0 lifts it.
const DEFAULT_FRAME_MAX_STEPS = 500_000;
const asked = new URLSearchParams(location.search).get('maxsteps');
const FRAME_MAX_STEPS = /^\d{1,15}$/.test(asked ?? '') ? Number(asked) : DEFAULT_FRAME_MAX_STEPS;

// A frame stopped by the cap: say so in words, with the raw report under it.
function describeError(report) {
  if (!/limitexceeded \(steps\)/.test(report)) return report;
  return `Stopped: limitexceeded (steps). One frame of the program did more than ` +
    `${FRAME_MAX_STEPS.toLocaleString()} steps of work, the playground's limit ` +
    '(one step per operator, loop pass, or KiB of decoded filter data), so it was cut off. ' +
    'The usual cause is one operator expanding a huge compressed stream. ' +
    'The page shows what it had drawn. Add ?maxsteps=N to the address to change the limit ' +
    '(0 for none).\n\n' + report;
}

// Examples carry their page size in the DSC BoundingBox when they
// have one; default to US Letter otherwise.
function pageSize(source) {
  const m = source.match(/%%BoundingBox:\s*0\s+0\s+(\d+)\s+(\d+)/);
  return m ? [Number(m[1]), Number(m[2])] : [612, 792];
}

// What the program printed with = == stack pstack print; the box stays
// hidden until there is something to show.
function showOutput() {
  const text = ps.output;
  if (out.textContent !== text) out.textContent = text;
  out.hidden = text === '';
}

function start() {
  cancelAnimationFrame(raf);
  err.textContent = '';
  warn.textContent = '';
  out.textContent = '';
  out.hidden = true;
  const [w, h] = pageSize(srcBox.value);
  let steps = 0;
  try {
    ps.begin(srcBox.value, w, h);
  } catch (e) {
    err.textContent = String(e);
    return;
  }
  const frame = () => {
    ps.maxSteps = FRAME_MAX_STEPS;
    const more = ps.step(Number(speed.value));
    steps += Number(speed.value);
    ps.paintTo(canvas);
    showOutput();
    // Font stand-ins (a pack face the build lacks), also on a clean run (#804).
    warn.textContent = ps.warnings.join('\n');
    if (more === 1) {
      status.textContent = `running… ${steps.toLocaleString()} steps`;
      raf = requestAnimationFrame(frame);
    } else if (more === -1) {
      const report = ps.error;
      err.textContent = describeError(report);
      status.textContent = report.includes('limitexceeded') ? 'stopped: step limit' : 'stopped on error';
    } else {
      status.textContent = 'done';
    }
  };
  raf = requestAnimationFrame(frame);
}

document.getElementById('run').addEventListener('click', start);
async function load(name) {
  const resp = await fetch(`examples/${name}`);
  if (!resp.ok) throw new Error(`could not load example ${name} (${resp.status})`);
  srcBox.value = await resp.text();
}

document.getElementById('examples').addEventListener('change', async (e) => {
  if (!e.target.value) return;
  await load(e.target.value);
  start();
});

// playground.html?example=NAME.ps opens examples/NAME.ps instead of the
// program above: the Learn page's "Try it" links use this. Only plain
// relative names are accepted (letters, digits, - _ and one folder).
const wanted = new URLSearchParams(location.search).get('example');
let ready = true;
if (wanted && /^([A-Za-z0-9_-]+\/)?[A-Za-z0-9_-]+\.ps$/.test(wanted)) {
  try {
    await load(wanted);
  } catch (e) {
    ready = false;
    err.textContent = String(e.message || e);
  }
}
if (ready) start();
</script>
</body>
</html>
