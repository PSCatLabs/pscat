# Transcendental math goes through src/fmath.rs (issue #738): the platform
# libm rounds differently on macOS, Linux and in the browser, so a direct
# `f64::sin` makes seeded renders differ between platforms. Use `fmath::sin`
# and friends. sqrt, powi, to_radians, floor and the other exact or purely
# arithmetic methods are fine and not listed. Test code that only needs a
# reference value may `#![allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "f64::sin", reason = "use crate::fmath: one libm on every platform (issue #738)" },
