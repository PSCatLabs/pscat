# Publish the pscat site (Stage 17) to GitHub Pages on every push to
# main. Needs Pages enabled with "GitHub Actions" as the source in
# the repo settings (Settings → Pages → Build and deployment).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per job (issue #602): only the deploy job, in the github-pages
# environment, may mint an OIDC token (scripts/check_workflows.py).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain below
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: ./scripts/build_site.sh
      # A broken link blocks the deploy (#250); site-check.yml runs the same
      # check on pull requests.
      - run: python3 scripts/check_site_links.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
