name: Feature request
description: An operator, a flag, a library procedure, a tool or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like pscat to do?
      description: Name the operator, flag or procedure if you can. A short PostScript example of how you would use it helps.
    validations:
      required: true
  - type: textarea
    id: intent
    attributes:
      label: Why / design intent
      description: Optional. What the change is for, and the idea behind its design. Agents read this to make the calls the issue does not spell out.
  - type: textarea
    id: perceptual
    attributes:
      label: Perceptual acceptance check
      description: Optional. How a person would judge the result by eye, for example "reads easily at gallery size". If the issue also has a metric (a size, a time, a count), put the check next to it; the check wins when the two disagree.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to try implementing this myself (see CONTRIBUTING.md)
